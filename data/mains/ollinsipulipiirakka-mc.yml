name: Masterchef-Ollin sipulipiirakka
type: pie
tags: pie
url : https://www.mtvuutiset.fi/makuja/reseptit/resepti/masterchef-sipulipiirakka-ollin-resepti
ingredients:
  pohja:
  - 40g parmesan raastettuna
  - 125g voi
  - 3dl vehnäjauho (gluteeniton jauhoseos)
  - 3rkl kylmää vettä
  täyte:
  - Reilusti erilaisia sipuleita (makea-, hopea-, salotti- punasipuli)
  - 75g voita
  - 1dl tummaa sokeria
  - 1-1,5dl valkoviinietikkaa
  - 0,5dl balsamicoa
  - Suolaa
  - Mustapippuria
  - 10 oksaa timjamia
  - 3 keltuaista
instructions:
  - POHJA - Sekoita kylmä voi, parmesanraaste ja jauhot ensin sekaisin tasaiseksi massaksi. Lisää vettä kunnes taikinasta tulee työstettävä taikinapallo. Kaulitse taikina ja laita se voilla voideltuun vuokaan. Esipaista 200c n. 10min kunnes taikinaan tulee hieman väriä.
  - TÄYTE - Leikkaa sipuleista 1cm paksuisia kiekkoja niin paljon että isohko pannu täyttyy. Sulata voi ja sokeria pannulla ja paista sipulikiekkoihin väriä. Käännä sipulit ja lisää etikat, suolaa ja pippuria sekä timjamia. Hauduta sipuleita pannulla hiljalleen kunnes neste muuttuu siirappiseksi.
  - Laita paistetut sipulit piirakkapohjalle. Sekoita 3 keltuaista, sipuleiden paistosiirappi ja tuoretta timjamia kastikkeeksi ja kaada piirakan päälle.
  - Paista vielä 200c n.10min