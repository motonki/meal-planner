name: Ahvenkeitto
url: https://www.k-ruoka.fi/reseptit/ahvenkeitto
servings: 4
type: main
tags: fish, soup, potato
ingredients:
  - 2–3(150 g)porkkanaa
  - 500gPirkka perunoita (keltainen pussi)
  - 1(100 g)sipuli
  - 1rklvoita
  - 7 1/2dlvettä
  - 1Knorr Fond "du Chef" kala-annosfondi
  - 2dlkuivaa valkoviiniä
  - n. 3/4tlsuolaa
  - 1laakerinlehti
  - 10kokonaista mustapippuria
  - 1ps(300 g)Pirkka ahvenfileitä (pakaste) tai tuoreita
  - 1ps(65 g)Pirkka Luomu babypinaattia
  - 1dlPirkka kuohukermaa
instructions:
  - Kuori ja viipaloi porkkanat. Kuori ja lohko perunat. Kuori ja hienonna sipuli.
  - Kuullota sipulia voissa kattilassa. Lisää joukkoon perunat ja porkkanat ja jatka kuullottamista vielä hetki.
  - Lisää joukkoon vesi,annosfondi, viini ja mausteet. Keitä 10–15 minuuttia.
  - Paloittele pakkauksen mukaan sulatetut ahvenfileet. Lisää kalat keittoon ja kypsennä vielä noin 5 minuuttia, kunnes kasvikset ja kala ovat kypsiä.
  -  Poista halutessasi pinaatista suurimmat lehtiruodit. Lisää lopuksi keiton joukkoon pinaatit ja kuohukerma. Kuumenna kiehuvaksi, mutta älä enää keitä, jotta pinaatti ei muuta väriään. Tarjoa heti.